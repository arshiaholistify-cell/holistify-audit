<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#60A500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transformation">
<title>Holistify – Transformation Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g:#60A500;--gh:#A8D08D;--gd:#4a8000;--gl:#f0f7e6;--gll:#f8fdf2;
  --pu:#7030A0;--pul:#f3eaf9;
  --r4:#4a8000;--r3:#60A500;--r2:#E8A33D;--r1:#D64545;
  --r4l:#eaf3df;--r3l:#eef7e0;--r2l:#fdf1e0;--r1l:#fbe9e9;
  --na:#948C7F;--nal:#efece7;
  --ink:#1C1A17;--inkm:#3D3A30;--inkl:#6B6258;--inkll:#948C7F;
  --sur:#F5F2EC;--card:#fff;--bdr:rgba(120,100,70,0.16);--bdrs:rgba(120,100,70,0.28);
  --rsm:8px;--rmd:12px;--rlg:18px;
  --sh:0 2px 8px rgba(0,0,0,0.06);--shm:0 8px 24px rgba(0,0,0,0.10);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html,body{background:var(--sur);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;max-width:640px;margin:0 auto;position:relative;padding-bottom:calc(64px + var(--safe-b))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--bdr);border-radius:var(--rsm);padding:10px 12px;width:100%;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(96,165,0,.12)}
textarea{resize:vertical;min-height:60px;line-height:1.4}
label{display:block;font-size:11.5px;font-weight:700;color:var(--inkm);letter-spacing:.02em;text-transform:uppercase;margin-bottom:5px}
.fld{margin-bottom:12px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;background:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh);border-bottom:2.5px solid var(--g)}
.topbar .back{width:34px;height:34px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:800;color:var(--ink);flex:1;line-height:1.25}
.topbar .sub{font-size:11px;color:var(--inkl);font-weight:500}
.topbar .brand{display:flex;align-items:center;gap:7px}
.topbar .brand img{height:20px;display:block}
.topbar .brand-txt{font-size:11px;font-weight:700;color:var(--g);letter-spacing:.03em}

/* Content */
.wrap{padding:14px 14px 24px}
.card{background:var(--card);border-radius:var(--rlg);box-shadow:var(--sh);padding:16px;margin-bottom:12px}

/* Stats strip */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--rmd);padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:20px;font-weight:800;color:var(--g)}
.stat span{font-size:10px;color:var(--inkl);font-weight:600;text-transform:uppercase;letter-spacing:.02em}

/* Observation list card */
.obs-card{background:var(--card);border-radius:var(--rmd);box-shadow:var(--sh);padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.obs-card .info{flex:1;min-width:0}
.obs-card .name{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obs-card .meta{font-size:11.5px;color:var(--inkl);margin-top:2px}
.obs-badge{min-width:44px;height:44px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;line-height:1}
.obs-badge span{font-size:7px;font-weight:700;opacity:.85;margin-top:1px}
.obs-badge.draft{background:var(--pul);color:var(--pu);font-size:9px}
.chev{color:var(--inkll);font-size:16px}
.type-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--pu);background:var(--pul);padding:2px 8px;border-radius:20px;margin-bottom:4px}

.empty{text-align:center;padding:50px 20px;color:var(--inkl)}
.empty .ico{font-size:40px;margin-bottom:10px}
.empty h3{color:var(--ink);font-size:15px;margin-bottom:5px}
.empty p{font-size:13px;line-height:1.5}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:var(--rsm);font-size:14px;font-weight:700;width:100%}
.btn-p{background:var(--g);color:#fff;box-shadow:0 4px 14px rgba(96,165,0,.3)}
.btn-p:active{background:var(--gd)}
.btn-s{background:var(--gl);color:var(--gd)}
.btn-o{background:#fff;border:1.5px solid var(--bdrs);color:var(--inkm)}
.btn-d{background:var(--r1l);color:var(--r1)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(96,165,0,.4);z-index:60}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;border-top:1px solid var(--bdr);display:flex;padding-bottom:var(--safe-b);z-index:55;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:10px;font-weight:600;color:var(--inkl)}
.nav button.on{color:var(--g)}
.nav button .ic{font-size:19px}

/* Type picker cards */
.type-card{background:var(--card);border-radius:var(--rlg);box-shadow:var(--sh);padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.type-card .ico{width:46px;height:46px;border-radius:12px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.type-card .tt{flex:1}
.type-card .tt b{font-size:14.5px;font-weight:700;display:block;margin-bottom:2px}
.type-card .tt span{font-size:11.5px;color:var(--inkl);line-height:1.4}

/* Section (form) */
details.sec{background:var(--card);border-radius:var(--rlg);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
details.sec summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
.sec-tt{flex:1}
.sec-grp{font-size:10px;font-weight:700;color:var(--pu);text-transform:uppercase;letter-spacing:.03em}
.sec-name{font-size:14.5px;font-weight:700;color:var(--ink)}
.sec-count{font-size:11.5px;font-weight:700;color:var(--g);background:var(--gl);padding:3px 9px;border-radius:20px;white-space:nowrap}
.sec-arrow{color:var(--inkll);transition:transform .2s;font-size:13px}
details[open] .sec-arrow{transform:rotate(180deg)}
.sec-body{padding:0 14px 12px;border-top:1px solid var(--bdr)}
.item{padding:13px 0;border-bottom:1px solid var(--bdr)}
.item:last-child{border-bottom:none}
.item-txt{font-size:13.5px;color:var(--inkm);line-height:1.45;margin-bottom:9px}
.rate-group{display:flex;gap:6px;align-items:center}
.rate-btn{flex:1;height:40px;border-radius:9px;background:#fff;border:1.5px solid var(--bdr);font-weight:800;font-size:15px;color:var(--inkl);display:flex;align-items:center;justify-content:center}
.rate-btn.lbl{font-size:11.5px;font-weight:700;letter-spacing:-.01em;padding:0 2px}
.rate-btn[data-css="r4"].active{background:var(--r4);border-color:var(--r4);color:#fff}
.rate-btn[data-css="r3"].active{background:var(--r3);border-color:var(--r3);color:#fff}
.rate-btn[data-css="r2"].active{background:var(--r2);border-color:var(--r2);color:#fff}
.rate-btn[data-css="r1"].active{background:var(--r1);border-color:var(--r1);color:#fff}
.rate-btn[data-css="na"].active{background:var(--na);border-color:var(--na);color:#fff}
.item-code{display:inline-block;font-size:10px;font-weight:800;color:var(--pu);background:var(--pul);border-radius:5px;padding:2px 6px;margin-right:7px;vertical-align:1px;letter-spacing:.02em}
.cmt-btn{width:40px;height:40px;border-radius:9px;background:var(--sur);border:1.5px solid var(--bdr);font-size:15px;flex-shrink:0}
.cmt-btn.has{background:var(--pul);border-color:var(--pu)}
.cmt-wrap{margin-top:8px}
.scale-hint{display:flex;gap:6px;margin-top:6px}
.scale-hint span{flex:1;font-size:8.5px;text-align:center;color:var(--inkll);font-weight:600}
.info-toggle{font-size:11px;font-weight:700;color:var(--pu);margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.info-wrap{margin-top:8px;background:var(--sur);border-radius:var(--rsm);padding:9px 10px}
.info-row{display:flex;gap:8px;padding:5px 0;font-size:11.5px;color:var(--inkm);line-height:1.4}
.info-row b{width:18px;height:18px;border-radius:5px;color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Page 2 of the printed checklists */
.p2-sub{font-size:10.5px;font-weight:700;color:var(--pu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.p2-block{padding:13px 0;border-bottom:1px solid var(--bdr)}
.p2-block:last-child{border-bottom:none;padding-bottom:0}
.p2-head{margin-bottom:9px}
.p2-title{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35}
.p2-hint{font-size:11px;color:var(--inkl);margin-top:2px;line-height:1.4}
.p2-note{font-size:11px;color:var(--inkl);line-height:1.5;margin-top:12px;padding-top:11px;border-top:1px solid var(--bdr);font-style:italic}
.tick-row{display:flex;flex-wrap:wrap;gap:7px}
.tick{padding:7px 12px;border-radius:20px;background:#fff;border:1.5px solid var(--bdr);font-size:12px;font-weight:600;color:var(--inkm);line-height:1.2}
.tick.on{background:var(--gl);border-color:var(--g);color:var(--gd)}
.tick.on::before{content:'✓ ';font-weight:800}
.tally{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px}
.choice-row{display:flex;gap:6px}
.choice-row.one .choice-btn{flex:0 0 auto;min-width:128px}
.choice-btn{flex:1;min-height:40px;border-radius:9px;background:#fff;border:1.5px solid var(--bdr);font-size:11.5px;font-weight:700;color:var(--inkl);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 6px;line-height:1.25}
.choice-btn.on[data-css="r4"]{background:var(--r4);border-color:var(--r4);color:#fff}
.choice-btn.on[data-css="r3"]{background:var(--r3);border-color:var(--r3);color:#fff}
.choice-btn.on[data-css="r2"]{background:var(--r2);border-color:var(--r2);color:#fff}
.choice-btn.on[data-css="r1"]{background:var(--r1);border-color:var(--r1);color:#fff}
.choice-btn.on[data-css="g"]{background:var(--g);border-color:var(--g);color:#fff}
.line-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.line-row:last-child{margin-bottom:0}
.line-n{width:20px;height:20px;border-radius:6px;background:var(--sur);color:var(--inkl);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.line-txt{flex:1;font-size:12.5px;color:var(--inkm);line-height:1.45}
.commit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}

/* Progress bar (sticky) */
.progress-wrap{position:sticky;top:calc(53px + var(--safe-t));z-index:40;background:var(--sur);padding:10px 14px 6px}
.progress-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--inkm);margin-bottom:6px}
.progress-bar{height:7px;background:var(--bdr);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;width:100%;background:var(--g);border-radius:20px;transform-origin:left;transform:scaleX(0);transition:transform .25s}

/* Score ring / summary */
.report-logo{display:block;height:30px;margin:0 auto 12px}
.report-title{text-align:center;font-size:11px;font-weight:800;color:var(--pu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.report-head{text-align:left;margin-bottom:10px}
.report-teacher{font-size:17px;font-weight:800;color:var(--ink);line-height:1.3}
.report-date{font-size:12px;font-weight:600;color:var(--inkl);margin-top:1px}
.report-meta{text-align:center;font-size:14px;font-weight:600;color:var(--inkm);margin-bottom:4px}
.report-meta b{color:var(--ink);font-weight:800}
.score-hero{text-align:center;padding:6px 10px 6px}
.score-num{font-size:46px;font-weight:800;line-height:1}
.score-num small{font-size:19px;font-weight:700;color:var(--inkl)}
.score-band{font-size:13px;font-weight:700;margin-top:4px;padding:4px 14px;border-radius:20px;display:inline-block}
.score-sub{font-size:11.5px;color:var(--inkl);margin-top:8px}
.sec-bar-row{display:flex;align-items:center;gap:10px;padding:9px 0}
.sec-bar-label{width:150px;font-size:12px;color:var(--inkm);font-weight:600;flex-shrink:0}
.sec-bar-track{flex:1;height:9px;background:var(--bdr);border-radius:20px;overflow:hidden}
.sec-bar-fill{height:100%;border-radius:20px}
.sec-bar-pct{width:38px;text-align:right;font-size:11.5px;font-weight:700;color:var(--inkm)}

.review-item{padding:10px 0;border-bottom:1px solid var(--bdr)}
.review-item:last-child{border-bottom:none}
.review-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.review-txt{font-size:12.5px;color:var(--inkm);flex:1;line-height:1.4}
.review-score{width:26px;height:26px;border-radius:7px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.review-score.wide{width:auto;min-width:54px;padding:0 9px;font-size:10.5px;font-weight:700;letter-spacing:.01em}
.review-cmt{font-size:11.5px;color:var(--inkl);margin-top:5px;font-style:italic;background:var(--sur);padding:6px 8px;border-radius:6px}
.review-lvl{font-size:11px;color:var(--inkl);margin-top:5px;background:var(--sur);padding:6px 8px;border-radius:6px;line-height:1.4}

.chip-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;background:var(--card);border:1.5px solid var(--bdr);font-size:12px;font-weight:600;color:var(--inkm);white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}

.teacher-row{background:var(--card);border-radius:var(--rmd);box-shadow:var(--sh);padding:13px 14px;margin-bottom:9px}
.teacher-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.teacher-top .name{font-size:14px;font-weight:700}
.teacher-top .cnt{font-size:11px;color:var(--inkl)}
.trend{display:flex;gap:4px;align-items:flex-end;height:34px}
.trend-bar{flex:1;border-radius:4px 4px 0 0;min-height:4px}

.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.timeline-item:last-child{border-bottom:none}
.timeline-dot{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--gl)}
.timeline-body{flex:1;min-width:0}
.timeline-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.timeline-type{font-size:12.5px;font-weight:700;color:var(--ink)}
.timeline-date{font-size:10.5px;color:var(--inkl);white-space:nowrap}
.timeline-avg{font-size:12px;font-weight:800;white-space:nowrap}
.timeline-meta{font-size:11px;color:var(--inkl);margin-top:2px}
.timeline-score{font-size:11.5px;font-weight:700;margin-top:3px}

.profile-meta{font-size:12.5px;color:var(--inkm);margin-top:6px;line-height:1.5}
.profile-meta b{color:var(--ink);font-weight:700}
.day-group{margin-bottom:2px}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 6px;border-top:1px solid var(--bdr)}
.day-group:first-child .day-head{border-top:none;padding-top:0}
.day-date{font-size:11px;font-weight:800;color:var(--inkl);text-transform:uppercase;letter-spacing:.03em}
.day-combined{font-size:10.5px;font-weight:700;color:var(--gd);background:var(--gl);padding:3px 9px;border-radius:20px;white-space:nowrap}

.section-title{font-size:12px;font-weight:800;color:var(--inkl);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.section-title:first-child{margin-top:0}

@media print{
  .nav,.fab,.topbar .back,.topbar .brand-txt{display:none!important}
  .review-score,.score-band,.obs-badge,.tick.on,.choice-btn.on,.tally,.item-code,.sec-bar-fill,.sec-count,.line-n{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{max-width:100%;padding-bottom:0}
  .topbar{position:static;box-shadow:none}
  .card,.review-item{box-shadow:none!important}
}
</style>

<div id="app"></div>

<script>
/* ---------- Rubric data ---------- */
function mk(prefix, arr){ return arr.map((t,i)=>({id:prefix+(i+1), text:t})); }
function mkD(prefix, arr){ return arr.map((pair,i)=>({id:prefix+(i+1), text:pair[0], levels:pair[1]})); }

/* ---------- Answer scales ---------- */
/* rating4 is the behaviourally-anchored 1-4 scale the walkthrough and lesson-plan
   reviews use. checklist is the Seen / Partly / Not yet / NA scale printed on the
   Effective Lesson and Effective Mentoring checklists. NA means "not applicable",
   not a low score, so it carries score:null and is left out of every average -
   an unscored indicator is not a zero. */
const SCALES = {
  rating4: {
    key: 'rating4', max: 4, showHint: true,
    options: [
      {v:4, label:'4', hint:'Extended',     score:4, css:'r4'},
      {v:3, label:'3', hint:'Good',         score:3, css:'r3'},
      {v:2, label:'2', hint:'Satisfactory', score:2, css:'r2'},
      {v:1, label:'1', hint:'Needs Imp.',   score:1, css:'r1'}
    ]
  },
  checklist: {
    key: 'checklist', max: 3, showHint: false, evidence: true,
    options: [
      {v:'seen',   label:'Seen',    score:3,    css:'r4'},
      {v:'partly', label:'Partly',  score:2,    css:'r2'},
      {v:'not',    label:'Not yet', score:1,    css:'r1'},
      {v:'na',     label:'NA',      score:null, css:'na'}
    ]
  }
};
function scaleOf(inst){ return SCALES[inst.scale] || SCALES.rating4; }
/* The one place a stored answer becomes an option. rating4 answers are kept on
   .score (as they always were); checklist answers on .value. */
function answerOf(inst, r){
  if(!r) return null;
  const sc = scaleOf(inst);
  const v = sc.key==='checklist' ? r.value : r.score;
  if(v===undefined || v===null || v==='') return null;
  return sc.options.find(o=>o.v===v) || null;
}
function answerScore(inst, r){ const a = answerOf(inst, r); return a ? a.score : null; }

function mkC(prefix, arr){
  return arr.map(([code, text])=>({ id: prefix+'_'+code.replace(/\./g,'_').toLowerCase(), code, text }));
}

/* ---------- The Effective Lesson Checklist (Holistify x Shaheen) ---------- */
/* One line for every indicator on the Lesson Observation sheet. The focus groups
   are the sheet's own: A covers 1A and 1B, B covers 2A, C covers 2B, D covers
   3A, 4A and 5A. */
const LESSON_CHECKLIST_SECTIONS = [
  {key:'1a', group:'Focus A', title:'1A · Physical & organisational support', items: mkC('lc',[
    ['1A.1', "Room is safe; seating is flexible and invites participation"],
    ['1A.2', "Displays show children's work and current learning"],
    ['1A.3', "Board shows date, class, subject and today's outcome"],
    ['1A.4', "Teacher can make eye contact with every child"]
  ])},
  {key:'1b', group:'Focus A', title:'1B · Social-emotional support', items: mkC('lc',[
    ['1B.1', "Children are greeted and spoken to warmly"],

/* ---------- Instruments ---------- */
/* An observation is scored against the rubric that was on screen when it was
   filled in, so replacing a rubric must not retro-score everything recorded on
   the previous one. Each report stores its rubric version; reports saved before
   this existed carry none and resolve to v1, which is the rubric they were
   actually scored on. Its item ids are untouched, so those reports still open,
   still total, and still read exactly as they did. */
const INSTRUMENTS = {
  lesson_obs: {
    v2: {name:'The Effective Lesson Checklist', short:'Lesson Checklist',
         desc:'Holistify x Shaheen · one line per indicator, with evidence.',
         sections: LESSON_CHECKLIST_SECTIONS, scale:'checklist', page2:'lesson', header:'lesson'},
    v1: {name:'Lesson Observation', short:'Observation',
         desc:'Full classroom observation across 7 focus areas.',
         sections: LESSON_OBS_SECTIONS_V1, scale:'rating4'}
  },
  mentor_perf: {
    v2: {name:'The Effective Mentoring Checklist', short:'Mentoring Checklist',
         desc:'Holistify x Shaheen · Part A teachers, Part B students and parents.',
         sections: MENTORING_CHECKLIST_SECTIONS, scale:'checklist', page2:'mentor', header:'mentor'},
    v1: {name:'Mentor Performance Review', short:'Mentor Review',
         desc:'Behaviourally-anchored review of a mentor/coach across 8 domains.',
         sections: MENTOR_PERF_SECTIONS_V1, scale:'rating4'}
  },
  walkthrough: {
    v1: {name:'Curriculum Pulse Walkthrough', short:'Walkthrough',
         desc:'Quick walkthrough of intended, taught & learned curriculum.',
         sections: WALKTHROUGH_SECTIONS, scale:'rating4'}
  },
  lesson_plan: {
    v1: {name:'Lesson Plan Checklist', short:'Lesson Plan',
         desc:"Behaviourally-anchored review of a teacher's lesson plan.",
         sections: LESSON_PLAN_SECTIONS, scale:'rating4'}
  }
};
/* The version a NEW report of each type is created against. */
const CURRENT_RUBRIC = { lesson_obs:'v2', mentor_perf:'v2', walkthrough:'v1', lesson_plan:'v1' };

function rubricOf(obs){
  const vers = INSTRUMENTS[obs.type] || INSTRUMENTS.lesson_obs;
  return vers[obs.rubric] ? obs.rubric : (vers.v1 ? 'v1' : Object.keys(vers)[0]);
}
function instrumentFor(obs){
  const vers = INSTRUMENTS[obs.type] || INSTRUMENTS.lesson_obs;
  return vers[rubricOf(obs)];
}
function instrumentAt(typeKey, rubric){
  const vers = INSTRUMENTS[typeKey] || INSTRUMENTS.lesson_obs;
  return vers[rubric] || vers.v1 || vers[Object.keys(vers)[0]];
}
function currentInstrument(typeKey){ return instrumentAt(typeKey, CURRENT_RUBRIC[typeKey]); }

/* ---------- Storage ---------- */
const OBS_KEY='holistify_transformation_observations_v1';
const SET_KEY='holistify_transformation_settings_v1';
const OLD_OBS_KEY='holistify_mentor_observations_v1';
const OLD_SET_KEY='holistify_mentor_settings_v1';
function loadObs(){
  try{
    const cur = localStorage.getItem(OBS_KEY);
    if(cur) return JSON.parse(cur);
    const old = localStorage.getItem(OLD_OBS_KEY);
    if(old){
      const list = JSON.parse(old).map(o=>({type:'lesson_obs', duration:'', ...o}));
      localStorage.setItem(OBS_KEY, JSON.stringify(list));
      return list;
    }
    return [];
  }catch(e){ return []; }
}
function saveObs(list){ localStorage.setItem(OBS_KEY, JSON.stringify(list)); }
function loadSettings(){
  try{
    const cur = localStorage.getItem(SET_KEY);
    if(cur) return JSON.parse(cur);
    const old = localStorage.getItem(OLD_SET_KEY);
    if(old) return JSON.parse(old);
    return {observer:''};
  }catch(e){ return {observer:''}; }
}
function saveSettings(s){ localStorage.setItem(SET_KEY, JSON.stringify(s)); }

/* ---------- Helpers ---------- */
function uid(){ return 'obs_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function findObs(id){ return OBS.find(o=>o.id===id); }
function newObsObj(typeKey){
  return {
    id: uid(), type: typeKey, rubric: CURRENT_RUBRIC[typeKey] || 'v1',
    teacher:'', grade:'', subject:'', topic:'', duration:'', date: todayStr(), observer: SETTINGS.observer||'',
    ratings:{}, extras:{}, targets:'', notes:'', status:'draft',
    createdAt: Date.now(), updatedAt: Date.now()
  };
}
/* The one place a report's figures are worked out. Everything downstream - the
   progress bar, the bars, the bands, the trends, the share text - reads this, so
   no two of them can disagree. avg stays in the instrument's own scale; pct is
   what lets a 3-point checklist and a 4-point rubric sit on one chart. */
function computeScore(obs){
  const inst = instrumentFor(obs);
  const sc = scaleOf(inst);
  let sum=0, scored=0, answered=0, na=0;
  const tally = {};
  sc.options.forEach(o=>{ tally[o.v]=0; });
  const sectionScores = inst.sections.map(sec=>{
    let ssum=0, scnt=0, sans=0;
    sec.items.forEach(it=>{
      const a = answerOf(inst, obs.ratings[it.id]);
      if(!a) return;
      answered++; sans++; tally[a.v]++;
      /* NA is "not applicable", not a low score: counted as answered, left out
         of every average. An indicator that does not apply is not a zero. */
      if(a.score===null){ na++; return; }
      ssum+=a.score; scnt++; sum+=a.score; scored++;
    });
    return { key:sec.key, title:sec.title, group:sec.group,
      count:sans, scored:scnt, total:sec.items.length,
      avg: scnt? Math.round((ssum/scnt)*10)/10 : null,
      pct: scnt? Math.round((ssum/scnt)/sc.max*1000)/10 : null };
  });
  return { rated:answered, scored, na, total:instTotal(inst), max:sc.max,
    avg: scored? Math.round((sum/scored)*10)/10 : 0,
    pct: scored? Math.round((sum/scored)/sc.max*1000)/10 : 0,
    tally, sectionScores };
}
/* Bands take a percentage of the instrument's own scale, so a 3-point checklist
   and a 4-point rubric land on the same four bands. The thresholds are the old
   1-4 cut-offs (3.5, 2.75 and 2.0 out of 4) written as percentages, so nothing
   already recorded on the 1-4 scale changes band. */
function band(pct){
  if(pct>=87.5) return {label:'Outstanding Practice', c:'var(--r4)', bg:'var(--r4l)'};
  if(pct>=68.75) return {label:'Strong Practice', c:'var(--r3)', bg:'var(--r3l)'};
  if(pct>=50) return {label:'Developing Practice', c:'var(--r2)', bg:'var(--r2l)'};
  return {label:'Needs Focused Support', c:'var(--r1)', bg:'var(--r1l)'};
}
function scoreColor(pct){ return pct>=87.5?'var(--r4)':pct>=68.75?'var(--r3)':pct>=50?'var(--r2)':'var(--r1)'; }
function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fieldSummary(o){
  const type = typeOf(o);
  const parts = [];
  if(o.subject && o.subject.trim()) parts.push(esc(o.subject));
  if(o.grade && o.grade.trim()) parts.push(esc((type.gradeLabel||'Grade')+' '+o.grade));
  if(o.topic && o.topic.trim()) parts.push(esc(o.topic));
  return parts.join(' · ');
}
function logoImg(cls){ return `<img src="holistify-logo.png" alt="Holistify" class="${cls||''}" onerror="this.style.display='none'">`; }

/* ---------- Home ---------- */
function renderHome(){
  const total = OBS.length;
  const teachers = new Set(OBS.filter(o=>typeOf(o).subjectType==='teacher').map(o=>o.teacher.trim()).filter(Boolean)).size;
  const completed = OBS.filter(o=>o.status==='complete');
  /* A percentage, because reports on the 1-4 rubrics and reports on the
     Seen/Partly/Not yet checklists are averaged together here. */
  const avgPct = completed.length? Math.round(completed.reduce((a,o)=>a+computeScore(o).pct,0)/completed.length) : 0;

  let list = OBS.slice().sort((a,b)=> new Date(b.date)-new Date(a.date) || b.updatedAt-a.updatedAt);

  let cards = list.map(o=>{
    const type = typeOf(o);
    const inst = instrumentFor(o);
    const sc = computeScore(o);
    const badge = o.status==='draft'
      ? `<div class="obs-badge draft">DRAFT</div>`
      : `<div class="obs-badge" style="background:${scoreColor(sc.pct)}">${sc.avg.toFixed(1)}<span>/${sc.max}</span></div>`;
    return `<div class="obs-card" onclick="openObservation('${o.id}')">
      <div class="info">
        <div class="type-pill">${type.icon} ${esc(inst.short)}</div>
        <div class="name">${esc(o.teacher)||'Untitled report'}</div>
        <div class="meta">${fieldSummary(o)? fieldSummary(o)+' · ' : ''}${fmtDate(o.date)}</div>
      </div>
      ${badge}
      <div class="chev">›</div>
    </div>`;
  }).join('');

  if(!list.length){
    cards = `<div class="empty">
      <div class="ico">📋</div>
      <h3>No reports yet</h3>
      <p>Tap the + button below to start your first report.</p>
    </div>`;
  }

  return `${brandBar('Transformation Dashboard')}
    <div class="wrap">
      <div class="stats">
        <div class="stat"><b>${total}</b><span>Reports</span></div>
        <div class="stat"><b>${teachers}</b><span>Teachers</span></div>
        <div class="stat"><b>${avgPct}%</b><span>Avg Score</span></div>
      </div>
      ${cards}
    </div>
    <div class="fab" onclick="openPicker()">+</div>`;
}

/* ---------- Page-2 blocks ---------- */
/* Rendered from the PAGE2 / HEADER_BLOCKS declarations so the form, the summary
   and the share text cannot drift. Option values are passed to the handlers by
   INDEX, never as text: a label like "Role play / simulation" cannot be spliced
   safely into an onclick attribute, and looking it up is one line. */
function extraOf(o, key){ return (o.extras||{})[key]; }
function blockDef(o, key){
  const inst = instrumentFor(o);
  const head = HEADER_BLOCKS[inst.header] || [];
  const p2 = (PAGE2[inst.page2] || {blocks:[]}).blocks;
  return head.concat(p2).find(b=>b.key===key) || null;
}
function tallyBand(b, n){
  return b.tally.bands.find(x=>n>=x.min) || b.tally.bands[b.tally.bands.length-1];
}
function tallyHtml(b, vals){
  const n = (vals||[]).length, bd = tallyBand(b, n);
  return `<span class="tally" id="tally-${b.key}" style="color:var(--${bd.css});background:var(--${bd.css}l)">${n} / ${b.options.length} · ${esc(bd.label)}</span>`;
}
function renderBlock(id, o, b){
  const v = extraOf(o, b.key);
  const head = `<div class="p2-head"><div class="p2-title">${esc(b.title)}</div>${b.hint?`<div class="p2-hint">${esc(b.hint)}</div>`:''}</div>`;
  if(b.type==='ticks'){
    const vals = Array.isArray(v)? v : [];
    const chips = b.options.map((opt,i)=>
      `<span class="tick${vals.indexOf(opt)>=0?' on':''}" onclick="toggleTick(this,'${id}','${b.key}',${i})">${esc(opt)}</span>`).join('');
    const other = b.other
      ? `<div class="fld" style="margin:9px 0 0"><input value="${esc(extraOf(o,b.key+'Other')||'')}" placeholder="Other…" oninput="updateExtra('${id}','${b.key}Other',this.value)"></div>`
      : '';
    const tally = b.tally? `<div style="margin-top:9px">${tallyHtml(b, vals)}</div>` : '';
    return `<div class="p2-block">${head}<div class="tick-row">${chips}</div>${other}${tally}</div>`;
  }
  if(b.type==='choice'){
    const btns = b.options.map((opt,i)=>
      `<button class="choice-btn${v===opt.v?' on':''}" data-css="${opt.css||'g'}" onclick="setChoice(this,'${id}','${b.key}',${i})">${esc(opt.label)}</button>`).join('');
    return `<div class="p2-block">${head}<div class="choice-row">${btns}</div></div>`;
  }
  if(b.type==='lines'){
    const vals = Array.isArray(v)? v : [];
    const rows = Array.from({length:b.n},(_,i)=>
      `<div class="line-row"><span class="line-n">${i+1}</span><input value="${esc(vals[i]||'')}" oninput="updateExtraLine('${id}','${b.key}',${i},this.value)"></div>`).join('');
    return `<div class="p2-block">${head}${rows}</div>`;
  }
  if(b.type==='commit'){
    const fields = b.fields.map(f=>
      `<div class="fld" style="margin-bottom:0"><label>${esc(f.label)}</label><input${f.type==='date'?' type="date"':''} value="${esc(extraOf(o,f.key)||'')}" oninput="updateExtra('${id}','${f.key}',this.value)"></div>`).join('');
    return `<div class="p2-block">${head}
      <textarea placeholder="${esc(b.hint||'')}…" oninput="updateExtra('${id}','${b.key}',this.value)">${esc(v||'')}</textarea>
      <div class="commit-grid">${fields}</div></div>`;
  }
  return '';
}

    const cnt = sec.items.filter(it=>answerOf(inst, o.ratings[it.id])).length;
    return `<details class="sec" ${si<2?'open':''}>
      <summary>
        <div class="sec-tt">
          ${sec.group?`<div class="sec-grp">${esc(sec.group)}</div>`:''}
          <div class="sec-name">${esc(sec.title)}</div>
        </div>
        <div class="sec-count" id="seccount-${sec.key}">${cnt}/${sec.items.length}</div>
        <div class="sec-arrow">▾</div>
      </summary>
      <div class="sec-body">${itemsHtml}</div>
    </details>`;
  }).join('');

  const p2 = inst.page2 ? PAGE2[inst.page2] : null;
  const page2Html = p2 ? `<div class="card">
      <div class="p2-sub">${esc(p2.sub)}</div>
      <div class="section-title" style="margin-top:0">${esc(p2.title)}</div>
      ${p2.blocks.map(b=>renderBlock(id,o,b)).join('')}
      ${p2.note?`<div class="p2-note">${esc(p2.note)}</div>`:''}
    </div>` : '';

  const targetsLabel = type.subjectType==='mentor' ? 'Targets for the mentor' : 'Targets for the teacher';
  const notesHtml = `<div class="card">
    <div class="fld"><label>${targetsLabel}</label><textarea placeholder="Key next steps to focus on..." oninput="updateField('${id}','targets',this.value)">${esc(o.targets)}</textarea></div>
    <div class="fld" style="margin-bottom:0"><label>Discussion / follow-up notes</label><textarea placeholder="Notes from the debrief conversation..." oninput="updateField('${id}','notes',this.value)">${esc(o.notes)}</textarea></div>
  </div>`;

  return `<div class="topbar">
      <div class="back" onclick="goHome()">←</div>
      <div><h1>${esc(o.teacher)||'New Report'}</h1><div class="sub">${type.icon} ${esc(inst.name)} · ${o.status==='draft'?'Draft · autosaved':'Completed'}</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-top"><span id="progress-label">${sc.rated}/${sc.total} answered</span><span id="progress-avg">${sc.avg.toFixed(1)}/${sc.max}</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="transform:scaleX(${sc.rated?sc.rated/sc.total:0})"></div></div>
    </div>
    <div class="wrap" style="padding-top:8px">
      ${fieldsHtml}
      ${headerHtml}
      ${sectionsHtml}
      ${page2Html}
      ${notesHtml}
      <div class="btn-row">
        <button class="btn btn-o" onclick="goHome()">Save &amp; Exit</button>
        <button class="btn btn-p" onclick="finishObservation('${id}')">Finish Report</button>
      </div>
    </div>`;
}

function updateField(id, field, val){
  const o = findObs(id); if(!o) return;
  o[field]=val; o.updatedAt=Date.now(); saveObs(OBS);
  if(field==='teacher'){ const h=document.querySelector('.topbar h1'); if(h) h.textContent = val || 'New Report'; }
}
/* Page-2 answers are written straight into o.extras and the DOM is nudged in
   place rather than re-rendered: a re-render would collapse every open section
   and throw away the caret in whatever was being typed. */
function updateExtra(id, key, val){
  const o = findObs(id); if(!o) return;
  o.extras = o.extras || {};
  o.extras[key] = val; o.updatedAt = Date.now(); saveObs(OBS);
}
function updateExtraLine(id, key, i, val){
  const o = findObs(id); if(!o) return;
  o.extras = o.extras || {};
  const cur = Array.isArray(o.extras[key]) ? o.extras[key].slice() : [];
  cur[i] = val; o.extras[key] = cur; o.updatedAt = Date.now(); saveObs(OBS);
}
function toggleTick(el, id, key, idx){
  const o = findObs(id); if(!o) return;
  const b = blockDef(o, key); if(!b) return;
  const opt = b.options[idx];
  o.extras = o.extras || {};
  const cur = Array.isArray(o.extras[key]) ? o.extras[key].slice() : [];
  const at = cur.indexOf(opt);
  if(at>=0) cur.splice(at,1); else cur.push(opt);
  o.extras[key] = cur; o.updatedAt = Date.now(); saveObs(OBS);
  el.classList.toggle('on', at<0);
  const t = document.getElementById('tally-'+key);
  if(t && b.tally){
    const bd = tallyBand(b, cur.length);
    t.textContent = cur.length+' / '+b.options.length+' · '+bd.label;
    t.style.color = 'var(--'+bd.css+')';
    t.style.background = 'var(--'+bd.css+'l)';
  }
}
function setChoice(el, id, key, idx){
  const o = findObs(id); if(!o) return;
  const b = blockDef(o, key); if(!b) return;
  const v = b.options[idx].v;
  o.extras = o.extras || {};
  const next = (o.extras[key]===v) ? null : v;
  o.extras[key] = next; o.updatedAt = Date.now(); saveObs(OBS);
  const row = el.closest('.choice-row');
  if(row) row.querySelectorAll('.choice-btn').forEach(b2=>b2.classList.remove('on'));
  if(next!==null) el.classList.add('on');
}
/* One handler for both scales. The option is passed by index into the
   instrument's own scale, so the same button markup serves 1-4 and
   Seen/Partly/Not yet/NA. Tapping the chosen option again clears it. */
function setAnswer(btn, obsId, itemId, optIdx){
  const o = findObs(obsId); if(!o) return;
  const inst = instrumentFor(o);
  const scale = scaleOf(inst);
  const opt = scale.options[optIdx]; if(!opt) return;
  if(!o.ratings[itemId]) o.ratings[itemId]={};
  const r = o.ratings[itemId];
  const cur = scale.key==='checklist' ? r.value : r.score;
  const next = (cur===opt.v) ? null : opt.v;
  if(scale.key==='checklist') r.value = next; else r.score = next;
  o.updatedAt = Date.now(); saveObs(OBS);
  const group = btn.closest('.rate-group');
  group.querySelectorAll('.rate-btn').forEach(b=>b.classList.remove('active'));
  if(next!==null) btn.classList.add('active');
  updateProgressUI(obsId);
}

function toggleComment(itemId){
  const wrap = document.getElementById('cmtwrap-'+itemId);
  wrap.style.display = wrap.style.display==='none' ? 'block' : 'none';
  if(wrap.style.display==='block'){ const ta=wrap.querySelector('textarea'); if(ta) ta.focus(); }
}
function toggleInfo(itemId){
  const wrap = document.getElementById('infowrap-'+itemId);
  wrap.style.display = wrap.style.display==='none' ? 'block' : 'none';
}
function updateComment(ta, obsId, itemId){
  const o = findObs(obsId); if(!o) return;
  if(!o.ratings[itemId]) o.ratings[itemId]={};
  o.ratings[itemId].comment = ta.value;
  o.updatedAt = Date.now(); saveObs(OBS);
  const btn = document.getElementById('cmtbtn-'+itemId);
  if(btn) btn.classList.toggle('has', !!ta.value.trim());
}
function updateProgressUI(obsId){
  const o = findObs(obsId); if(!o) return;
  const sc = computeScore(o);
  const lbl = document.getElementById('progress-label'); if(lbl) lbl.textContent = sc.rated+'/'+sc.total+' answered';
  const avgEl = document.getElementById('progress-avg'); if(avgEl) avgEl.textContent = sc.avg.toFixed(1)+'/'+sc.max;
  const fill = document.getElementById('progress-fill'); if(fill) fill.style.transform = 'scaleX('+(sc.rated?sc.rated/sc.total:0)+')';
  sc.sectionScores.forEach(s=>{
    const el = document.getElementById('seccount-'+s.key);
    if(el) el.textContent = s.count+'/'+s.total;
  });
}
function finishObservation(id){
  const o = findObs(id); if(!o) return;
  o.status='complete'; o.updatedAt=Date.now(); saveObs(OBS);
  go('summary', id);
}

/* ---------- Summary ---------- */
function answerChip(inst, a){
  const wide = scaleOf(inst).key==='checklist';
  return `<div class="review-score${wide?' wide':''}" style="background:var(--${a.css})">${esc(a.label)}</div>`;
}
/* The read-only twin of renderBlock, from the same declaration. A block the
   author left empty prints nothing rather than an empty frame. */
function renderBlockSummary(o, b){
  const v = extraOf(o, b.key);
  const title = `<div class="p2-title">${esc(b.title)}</div>`;
  if(b.type==='ticks'){
    const picked = Array.isArray(v)? v.slice() : [];
    const other = extraOf(o, b.key+'Other');
    if(other && String(other).trim()) picked.push(String(other).trim());
    if(!picked.length) return '';
    const chips = picked.map(t=>`<span class="tick on">${esc(t)}</span>`).join('');
    const tally = b.tally? `<div style="margin-top:8px">${tallyHtml(b, Array.isArray(v)?v:[])}</div>` : '';
    return `<div class="p2-block">${title}<div class="tick-row">${chips}</div>${tally}</div>`;
  }
  if(b.type==='choice'){
    const opt = b.options.find(x=>x.v===v);
    if(!opt) return '';
    return `<div class="p2-block">${title}<div class="choice-row one"><span class="choice-btn on" data-css="${opt.css||'g'}">${esc(opt.label)}</span></div></div>`;
  }
  if(b.type==='lines'){
    const vals = (Array.isArray(v)? v : []).map(x=>(x||'').trim()).filter(Boolean);
    if(!vals.length) return '';
    const rows = vals.map((t,i)=>`<div class="line-row"><span class="line-n">${i+1}</span><div class="line-txt">${esc(t)}</div></div>`).join('');
    return `<div class="p2-block">${title}${rows}</div>`;
  }
  if(b.type==='commit'){
    const txt = (v||'').trim();
    const meta = b.fields.map(f=>{
      const x = extraOf(o, f.key);
      return (x && String(x).trim()) ? esc(f.label)+': '+esc(f.type==='date'? fmtDate(x) : x) : '';
    }).filter(Boolean).join(' · ');
    if(!txt && !meta) return '';
    return `<div class="p2-block">${title}${txt?`<div class="line-txt">${esc(txt)}</div>`:''}${meta?`<div class="p2-hint" style="margin-top:6px">${meta}</div>`:''}</div>`;
  }
  return '';
}

      <div class="card">${reviewHtml || '<div style="font-size:13px;color:var(--inkl)">No items answered.</div>'}</div>

      <div class="btn-row">

function shareObservation(id){
  const o = findObs(id); if(!o) return;
  const type = typeOf(o);
  const inst = instrumentFor(o);
  const scale = scaleOf(inst);
  const sc = computeScore(o);
  const b = band(sc.pct);
  let txt = `Holistify – ${inst.name}\n`;
  txt += `${type.subjectType==='mentor'?'Mentor':'Teacher'}: ${o.teacher||'—'}\n`;
  txt += `${type.gradeLabel||'Grade/Class'}: ${o.grade||'—'} | Subject: ${o.subject||'—'} | Topic: ${o.topic||'—'}\nDate: ${fmtDate(o.date)}\nObserver: ${o.observer||'—'}\n\n`;
  txt += `Overall: ${sc.avg.toFixed(1)}/${sc.max} (${b.label})\n`;
  if(scale.key==='checklist'){
    txt += scale.options.map(opt=>`${sc.tally[opt.v]||0} ${opt.label}`).join(' · ')+`\n`;
  }
  txt += `\n`;
  sc.sectionScores.forEach(s=>{ txt += `${s.title}: ${s.avg===null?'—':s.avg.toFixed(1)+'/'+sc.max}\n`; });
  /* Page 2 travels with the summary: the overall judgement and the agreed next
     steps are the part a school acts on. */
  const p2 = inst.page2 ? PAGE2[inst.page2] : null;
  if(p2){
    p2.blocks.forEach(bl=>{
      const v = extraOf(o, bl.key);
      if(bl.type==='choice'){
        const opt = bl.options.find(x=>x.v===v);
        if(opt) txt += `\n${bl.title}: ${opt.label}\n`;
      } else if(bl.type==='lines'){
        const vals = (Array.isArray(v)? v : []).map(x=>(x||'').trim()).filter(Boolean);
        if(vals.length) txt += `\n${bl.title}:\n`+vals.map((t,i)=>`${i+1}. ${t}`).join('\n')+`\n`;
      }
    });
  }
  if(o.targets) txt += `\nTargets:\n${o.targets}\n`;
  if(o.notes) txt += `\nDiscussion Notes:\n${o.notes}\n`;

  if(navigator.share){
    navigator.share({title:'Holistify – '+(o.teacher||''), text:txt}).catch(()=>{});
  } else {
    navigator.clipboard && navigator.clipboard.writeText(txt);
    alert('Summary copied to clipboard.');
  }
}

/* ---------- Teacher profile (consolidated, date-wise) ---------- */
/* Pooled as a share of each instrument's own scale, so reports answered on
   Seen/Partly/Not yet and reports rated 1-4 can be averaged together without
   one of them quietly counting for more. */
function pooledPct(list){
  let sum=0, n=0;
  list.forEach(o=>{
    const inst = instrumentFor(o);
    const mx = scaleOf(inst).max;
    Object.keys(o.ratings||{}).forEach(k=>{
      const s = answerScore(inst, o.ratings[k]);
      if(s!==null){ sum += s/mx; n++; }
    });
  });
  return n? Math.round(sum/n*100) : null;
}
/* Keyed on type AND rubric version: two lesson reports answered on different
   rubrics have different sections, so pooling them under one heading would
   average indicators that are not the same indicators. */
function domainAvgsForInstrument(list, typeKey, rubric){
  const inst = instrumentAt(typeKey, rubric);
  const mx = scaleOf(inst).max;
  const subset = list.filter(o=>o.type===typeKey && rubricOf(o)===rubric);
  return inst.sections.map(sec=>{
    let sum=0, n=0;
    subset.forEach(o=>{ sec.items.forEach(it=>{
      const s = answerScore(inst, o.ratings[it.id]);
      if(s!==null){ sum+=s; n++; }
    }); });
    return { key:sec.key, title:sec.title, group:sec.group, max:mx,
      avg: n? Math.round(sum/n*10)/10 : null,
      pct: n? Math.round(sum/n/mx*1000)/10 : null };
  });
}
function uniqueObservers(list){ return [...new Set(list.map(o=>(o.observer||'').trim()).filter(Boolean))]; }

function renderTeacherProfile(name){
  const kind = PEOPLE_KIND;
  const list = OBS.filter(o=>o.status==='complete' && (o.teacher.trim()||'Unnamed')===name && typeOf(o).subjectType===kind)
    .slice().sort((a,b)=> new Date(a.date)-new Date(b.date));

  const overallPct = pooledPct(list) || 0;
  const mentors = uniqueObservers(list);
  const counts = {};
  list.forEach(o=>{ const k=o.type+'|'+rubricOf(o); counts[k]=(counts[k]||0)+1; });
  const instKeys = Object.keys(counts);
  const countChips = instKeys.map(k=>{
    const [tk,rv] = k.split('|');
    const t = REPORT_TYPES[tk]||REPORT_TYPES.lesson_obs;
    const inst = instrumentAt(tk,rv);
    return `<span class="chip">${t.icon} ${counts[k]} ${esc(inst.short)}</span>`;
  }).join('');

  const domainCards = instKeys.map(k=>{
    const [tk,rv] = k.split('|');
    const t = REPORT_TYPES[tk]||REPORT_TYPES.lesson_obs;
    const inst = instrumentAt(tk,rv);
    const domains = domainAvgsForInstrument(list, tk, rv).filter(d=>d.avg!==null);
    if(!domains.length) return '';
    const bars = domains.map(d=>{
      const c = scoreColor(d.pct);
      return `<div class="sec-bar-row">
        <div class="sec-bar-label">${d.group?esc(d.group)+' · ':''}${esc(d.title)}</div>
        <div class="sec-bar-track"><div class="sec-bar-fill" style="width:${d.pct}%;background:${c}"></div></div>
        <div class="sec-bar-pct">${d.avg.toFixed(1)}</div>
      </div>`;
    }).join('');
    return `<div class="card"><div class="section-title" style="margin-top:0">${t.icon} ${esc(inst.name)} — Consolidated Domain Averages <span class="p2-hint" style="display:inline">(out of ${inst.sections.length?scaleOf(inst).max:4})</span></div>${bars}</div>`;
  }).join('');

  const byDate = {};
  list.forEach(o=>{ (byDate[o.date]=byDate[o.date]||[]).push(o); });
  const dates = Object.keys(byDate).sort((a,b)=> new Date(b)-new Date(a));

  const timeline = dates.map(d=>{
    const dayList = byDate[d];
    const combined = dayList.length>1 ? pooledPct(dayList) : null;
    const items = dayList.map(o=>{
      const type = typeOf(o);
      const inst = instrumentFor(o);
      const sc = computeScore(o);
      return `<div class="timeline-item" onclick="openObservation('${o.id}')" style="cursor:pointer">
        <div class="timeline-dot">${type.icon}</div>
        <div class="timeline-body">
          <div class="timeline-top"><span class="timeline-type">${esc(inst.name)}</span><span class="timeline-avg" style="color:${scoreColor(sc.pct)}">${sc.avg.toFixed(1)}/${sc.max}</span></div>
          <div class="timeline-meta">${fieldSummary(o)? fieldSummary(o)+' · ' : ''}by ${esc(o.observer)||'—'}</div>
          <div class="timeline-score" style="color:${scoreColor(sc.pct)}">${band(sc.pct).label}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="day-group">
      <div class="day-head">
        <span class="day-date">${fmtDate(d)}</span>
        ${combined!==null? `<span class="day-combined">${dayList.length} reports · combined ${combined}%</span>`:''}
      </div>
      ${items}
    </div>`;
  }).join('');

  const subjectLabel = kind==='mentor' ? 'Mentor / Coach' : 'Teacher';
  const observerLabel = kind==='mentor' ? 'Reviewed by' : 'Mentor/Coach';
  return `<div class="topbar"><div class="back" onclick="go('teachers')">←</div><div><h1>${esc(name)}</h1><div class="sub">Consolidated report history</div></div></div>
    <div class="wrap">
      <div class="card">
        <div class="score-hero" style="padding-top:2px">
          <div class="score-num" style="color:${scoreColor(overallPct)};font-size:36px">${overallPct}<small>%</small></div>
          <div class="score-sub">${list.length} report${list.length!==1?'s':''} across all types</div>
        </div>
        <div class="profile-meta"><b>${subjectLabel}:</b> ${esc(name)}</div>
        <div class="profile-meta"><b>${observerLabel}:</b> ${mentors.length? esc(mentors.join(', ')) : '—'}</div>
        <div class="chip-row" style="margin-top:10px;margin-bottom:0">${countChips}</div>
      </div>
      ${domainCards}
      <div class="card">
        <div class="section-title" style="margin-top:0">Timeline · Combined &amp; Separate (most recent day first)</div>
        ${timeline || '<div style="font-size:13px;color:var(--inkl)">No reports yet.</div>'}
      </div>
    </div>`;
}

/* ---------- Settings ---------- */
function renderSettings(){
  return `${brandBar('Settings')}
    <div class="wrap">
      <div class="card">
        <div class="fld" style="margin-bottom:0"><label>Default observer name</label>
          <input value="${esc(SETTINGS.observer)}" placeholder="Your name" oninput="updateSettingsField('observer',this.value)">
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">Data</div>
        <div class="btn-row"><button class="btn btn-o" onclick="exportData()">Export backup (.json)</button></div>
        <div style="height:8px"></div>
        <div class="btn-row">
          <button class="btn btn-o" onclick="document.getElementById('importFile').click()">Import backup</button>
        </div>
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">
        <div style="height:8px"></div>
        <div class="btn-row"><button class="btn btn-d" onclick="clearData()">Clear all data</button></div>
      </div>
      <div class="card" style="font-size:12px;color:var(--inkl);line-height:1.6">
        Data is stored only on this device's browser. Export a backup regularly, especially before switching phones or clearing browser data.
      </div>
    </div>`;
}
function updateSettingsField(field,val){ SETTINGS[field]=val; saveSettings(SETTINGS); }
function exportData(){
  const blob = new Blob([JSON.stringify({observations:OBS, settings:SETTINGS}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'holistify-transformation-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(Array.isArray(data.observations)){
        OBS = data.observations.map(o=>({type:'lesson_obs', duration:'', ...o})); saveObs(OBS);
        if(data.settings){ SETTINGS = data.settings; saveSettings(SETTINGS); }
        alert('Backup imported successfully.');
        go('home');
      } else { alert('This file does not look like a valid backup.'); }
    }catch(err){ alert('Could not read this file.'); }
  };
  reader.readAsText(file);
}
function clearData(){
  if(!confirm('This will permanently delete all reports on this device. Continue?')) return;
  OBS = []; saveObs(OBS); go('home');
}

/* ---------- Init ---------- */
render();
</script>
</body>
</html>
